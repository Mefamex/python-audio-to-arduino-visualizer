[project]
name = "python-audio-to-arduino-visualizer"
version = "0.1.0"
description = "High-performance PulseAudio music visualizer mapping frequency bands to Arduino PWM via serial."
readme = "README.md"
authors = [{ name = "Mefamex", email = "info@mefamex.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = [
    "audio",
    "visualizer",
    "arduino",
    "pulseaudio",
    "led",
    "dsp",
    "scipy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = ["numpy>=2.5.2", "pyserial>=3.5", "scipy>=1.18.1"]

[project.scripts]
sound-to-usb-serial = "sound_to_usb_serial.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sound_to_usb_serial"]
