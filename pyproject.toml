[project]
name = "python-audio-to-arduino-visualizer"
version = "0.1.0"
description = "High-performance PulseAudio music visualizer mapping frequency bands to Arduino PWM via serial."
readme = "README.md"
authors = [{ name = "Mefamex", email = "info@mefamex.com" }]
requires-python = ">=3.14"
license = "MIT"
keywords = [
    "audio",
    "visualizer",
    "arduino",
    "pulseaudio",
    "led",
    "dsp",
    "scipy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = ["numpy>=2.5.2", "pyserial>=3.5", "scipy>=1.18.1"]

[project.scripts]
python-audio-to-arduino-visualizer = "python_audio_to_arduino_visualizer.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
extend-ignore = ["BLE001"]
